name: CI

on:
  push:
    branches: '**'
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data-fiduciary-toolkit

    strategy:
      fail-fast: false
      matrix:
        # Matches engines.node (>=26). Note the suite needs 24+ regardless:
        # `npm test` passes --test-global-setup, which Node rejects as a bad
        # option before 24.
        node-version: [26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: data-fiduciary-toolkit/package-lock.json

      # `env:` values are not shell-expanded, so a literal "~/..." would make
      # mongodb-memory-server download into a directory actually named "~"
      # inside the working dir - never the path actions/cache restores.
      - name: Resolve MongoDB binary cache path
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          # test-setup.js pins the mongod version, so it belongs in the key -
          # the lockfile alone would not change when that pin moves.
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('data-fiduciary-toolkit/package-lock.json', 'data-fiduciary-toolkit/scripts/test-setup.js') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
